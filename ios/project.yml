name: Lasso
options:
  developmentLanguage: en
  bundleIdPrefix: com.mcosti
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: "5.0.0"


settings:
  base:
    DEVELOPMENT_TEAM: 5P48NYSHQ2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
    TARGETED_DEVICE_FAMILY: "1"
    # Extracts SwiftUI Text literals and String(localized:) keys into
    # Shared/Localizable.xcstrings during the build.
    SWIFT_EMIT_LOC_STRINGS: YES
    # RevenueCat key for the App Store build. Empty (the default) means no
    # purchases at all: the open-source build. The real value goes in
    # Secrets.xcconfig.local (git-ignored, copy Secrets.xcconfig.example) and
    # is passed with `xcodebuild ... -xcconfig Secrets.xcconfig.local`.
    # xcodegen refuses a missing configFiles entry, hence the flag.
    REVENUECAT_API_KEY: ""
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"

targets:
  Lasso:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Resources
    dependencies:
      - target: LassoWidget
      - package: RevenueCat
        product: RevenueCat
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lasso
        CFBundleLocalizations: [en, nl]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Wakes the app for Bluetooth events (connect, disconnect, lock state)
        # while it is in the background, and relaunches it after iOS evicts it.
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Lasso talks to your Cowboy bike over Bluetooth to notice when it locks itself and unlock it again.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (xcodegen defaults targets to 1,2)
        PRODUCT_BUNDLE_IDENTIFIER: com.mcosti.lasso
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LassoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Lasso
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (xcodegen defaults targets to 1,2)
        PRODUCT_BUNDLE_IDENTIFIER: com.mcosti.lasso.uitests
        TEST_TARGET_NAME: Lasso
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: TestRunObserver

  LassoWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Lasso
        CFBundleLocalizations: [en, nl]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (xcodegen defaults targets to 1,2)
        PRODUCT_BUNDLE_IDENTIFIER: com.mcosti.lasso.widget

schemes:
  Lasso:
    build:
      targets:
        Lasso: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LassoUITests
    archive:
      config: Release
